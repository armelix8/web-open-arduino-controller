services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

  bridge:
    build: ./bridge
    restart: unless-stopped
    environment:
      BRIDGE_PORT: "3001"
      BRIDGE_MAX_REMOTES: ${BRIDGE_MAX_REMOTES:-20}
      BRIDGE_MAX_ROOMS: ${BRIDGE_MAX_ROOMS:-500}
    expose:
      - "3001"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - bridge
